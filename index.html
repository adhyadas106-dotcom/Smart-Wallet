                    <form class="login-form" id="login-form" action="#" method="get">
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#e9eef2">
    <title>Smart Wallet | Sign in</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>
        tailwind = { config: { prefix: "tw-", corePlugins: { preflight: false } } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <style>
        :root {
            --ink: #17233c;
            --muted: #8792a8;
            --blue: #466af4;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 32px 16px;
            background: #e9eef2;
            color: var(--ink);
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        }

        .login-shell {
            width: min(1120px, 100%);
            min-height: 600px;
            display: grid;
            grid-template-columns: 39% 61%;
            margin: auto;
            overflow: hidden;
            padding: 0 !important;
            background: #fff;
            box-shadow: 0 24px 60px rgb(26 47 76 / 18%);
            animation: arrive 600ms ease-out both;
        }

        .login-panel {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            padding: 32px 38px 40px;
            background: #fff;
        }

        .image-panel {
            min-width: 0;
            min-height: 600px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #fff;
        }

        .wallet-art {
            display: block;
            width: 100%;
            height: auto;
            max-height: 600px;
            object-fit: contain;
        }

        .topbar {
            display: flex;
            align-items: center;
            gap: 27px;
        }

        .topbar a {
            color: #333b4b;
            font-size: 12px;
            text-decoration: none;
            transition: color 160ms ease;
        }

        .topbar a:hover,
        .topbar a:focus-visible {
            color: var(--blue);
        }

        .form-wrap {
            width: min(330px, 100%);
            margin: auto;
            padding: 38px 0 24px;
        }

        .wallet-title {
            margin: 0 0 12px;
            color: #8540d0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(38px, 5vw, 46px);
            font-weight: 700;
            line-height: 1.1;
            text-align: center;
        }

        .welcome {
            margin: 0 0 30px;
            color: #40047d;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 20px;
            font-weight: 700;
            line-height: 1.25;
            text-align: center;
        }

        .login-form {
            display: grid;
            gap: 13px;
        }

        .login-form input {
            width: 100%;
            min-height: 46px;
            padding: 0 17px;
            border: 1px solid transparent;
            border-radius: 24px;
            outline: none;
            background: #f5f3f9;
            color: var(--ink);
            font: inherit;
            font-size: 13px;
            transition: border-color 160ms ease, background 160ms ease, box-shadow 160ms ease;
        }

        .login-form input::placeholder {
            color: #a4a8b5;
        }

        .login-form input:focus {
            border-color: #9cafff;
            background: #fff;
            box-shadow: 0 0 0 3px rgb(70 106 244 / 12%);
        }

        .submit-button {
            width: 128px;
            min-height: 42px;
            margin-top: 6px;
            border: 0;
            border-radius: 24px;
            background: linear-gradient(110deg, #5c5af4, #5d8ff2);
            box-shadow: 0 7px 15px rgb(75 103 226 / 25%);
            color: #fff;
            cursor: pointer;
            font: inherit;
            font-size: 13px;
            transition: transform 160ms ease, box-shadow 160ms ease;
        }

        .submit-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 19px rgb(75 103 226 / 32%);
        }

        .forgot-link {
            display: inline-block;
            color: #6479ea;
            font-size: 12px;
            text-decoration: none;
        }

        .account-links {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: 20px;
            margin-top: 28px;
        }

        .form-view[hidden] {
            display: none;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .art-panel {
            position: relative;
            min-height: 600px;
            overflow: hidden;
            isolation: isolate;
            background:
                radial-gradient(ellipse at 20% 100%, #13d7e8 0 8%, transparent 8.3%),
                radial-gradient(ellipse at 95% 100%, #122eda 0 10%, transparent 10.3%),
                linear-gradient(135deg, #14c9f4, #1488ee 43%, #1748d8);
            clip-path: ellipse(95% 88% at 63% 50%);
        }

        .art-panel::before {
            position: absolute;
            z-index: -1;
            inset: 12% 0 7% 11%;
            background-image:
                linear-gradient(30deg, transparent 48%, #70e9ff 49%, #70e9ff 50%, transparent 51%),
                linear-gradient(150deg, transparent 48%, #70e9ff 49%, #70e9ff 50%, transparent 51%);
            background-size: 68px 58px;
            content: "";
            opacity: .43;
            pointer-events: none;
            mask-image: radial-gradient(ellipse, #000 0 55%, transparent 76%);
            animation: circuit-flow 18s linear infinite;
        }

        .art-grid {
            position: absolute;
            inset: 0;
        }

        .orb {
            position: absolute;
            border: 1px solid rgb(127 245 255 / 54%);
            border-radius: 50%;
            background: linear-gradient(145deg, #38dff0, #1683e8 72%);
            box-shadow: 0 18px 34px rgb(5 42 160 / 22%), inset -10px -11px 18px rgb(10 61 197 / 25%);
        }

        .orb-cloud,
        .orb-lock,
        .orb-camera,
        .orb-phone,
        .data-card {
            animation: float 5s ease-in-out infinite;
        }

        .orb-lock { animation-delay: -1.2s; }
        .orb-camera { animation-delay: -2.4s; }
        .orb-phone { animation-delay: -3.6s; }
        .data-card { animation-delay: -2s; }

        .orb-cloud {
            top: 13%;
            left: 34%;
            width: 92px;
            height: 65px;
            border: 0;
            border-radius: 48% 52% 43% 47%;
            color: #b7ffff;
            font-size: 34px;
            line-height: 65px;
            text-align: center;
            transform: rotate(-12deg);
        }

        .orb-lock {
            top: 21%;
            right: 12%;
            width: 54px;
            height: 54px;
            border-radius: 12px;
            color: #dafcff;
            font-size: 30px;
            line-height: 54px;
            text-align: center;
            transform: rotate(12deg);
        }

        .orb-camera {
            top: 26%;
            right: 5%;
            width: 90px;
            height: 62px;
            border-radius: 13px;
            color: #b8ffff;
            font-size: 38px;
            line-height: 62px;
            text-align: center;
            transform: rotate(-8deg);
        }

        .orb-camera::after {
            position: absolute;
            top: 19px;
            right: -17px;
            width: 20px;
            height: 25px;
            border-radius: 0 6px 6px 0;
            background: #2ed5ed;
            content: "";
        }

        .orb-phone {
            right: 11%;
            bottom: 17%;
            width: 62px;
            height: 112px;
            border: 6px solid #45d9f2;
            border-radius: 11px;
            background: linear-gradient(160deg, #b5ffff, #44c7f1);
            box-shadow: 11px 13px 0 rgb(12 57 177 / 45%);
            transform: rotate(8deg);
        }

        .platform {
            position: absolute;
            bottom: 17%;
            left: 13%;
            width: 185px;
            height: 92px;
            border: 2px solid rgb(116 238 255 / 75%);
            border-radius: 16px;
            background: linear-gradient(145deg, #8ff7ff, #2ba9f1 65%, #1670df);
            box-shadow: 0 19px 0 #1155c5, 0 32px 35px rgb(5 33 126 / 35%);
            transform: rotate(-24deg) skewX(15deg);
        }

        .platform::before {
            position: absolute;
            inset: 14px;
            border: 1px solid rgb(15 108 208 / 45%);
            border-radius: 9px;
            content: "";
        }

        .wallet-core {
            position: absolute;
            top: 44%;
            left: 49%;
            width: 142px;
            height: 142px;
            display: grid;
            place-items: center;
            border: 1px solid rgb(174 255 255 / 78%);
            border-radius: 50%;
            background: linear-gradient(145deg, rgb(81 238 245 / 92%), rgb(20 124 220 / 88%));
            box-shadow: 0 0 0 12px rgb(76 224 248 / 15%), 0 22px 40px rgb(9 45 150 / 35%);
            color: #e4ffff;
            font-size: 50px;
            transform: translate(-50%, -50%);
            animation: wallet-glow 3.2s ease-in-out infinite;
        }

        .wallet-core::before,
        .wallet-core::after {
            position: absolute;
            width: 190px;
            height: 1px;
            background: rgb(131 246 255 / 55%);
            content: "";
        }

        .wallet-core::after {
            transform: rotate(90deg);
        }

        .data-card {
            position: absolute;
            top: 34%;
            left: 19%;
            width: 106px;
            height: 75px;
            padding: 12px;
            border: 1px solid rgb(210 255 255 / 65%);
            border-radius: 8px;
            background: linear-gradient(145deg, #8af3fb, #28b6e6);
            box-shadow: 8px 12px 0 rgb(13 64 174 / 45%);
            transform: rotate(-16deg);
        }

        .data-card span {
            display: block;
            height: 5px;
            margin: 5px 0;
            border-radius: 5px;
            background: rgb(255 255 255 / 75%);
        }

        .data-card span:nth-child(2) { width: 65%; }
        .data-card span:nth-child(3) { width: 82%; }

        .spark {
            position: absolute;
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: #55e7f2;
            box-shadow: 0 0 18px #42e7f5;
            animation: twinkle 2.6s ease-in-out infinite;
        }

        .spark-one { top: 17%; right: 27%; }
        .spark-two { top: 56%; right: 13%; width: 8px; height: 8px; }
        .spark-three { bottom: 11%; left: 41%; width: 9px; height: 9px; }

        .spark-two { animation-delay: .8s; }
        .spark-three { animation-delay: 1.6s; }

        @keyframes float {
            0%, 100% { translate: 0 0; }
            50% { translate: 0 -10px; }
        }

        @keyframes wallet-glow {
            0%, 100% { box-shadow: 0 0 0 12px rgb(76 224 248 / 15%), 0 22px 40px rgb(9 45 150 / 35%); }
            50% { box-shadow: 0 0 0 20px rgb(76 224 248 / 22%), 0 24px 48px rgb(9 45 150 / 45%); }
        }

        @keyframes twinkle {
            0%, 100% { opacity: .5; scale: .8; }
            50% { opacity: 1; scale: 1.25; }
        }

        @keyframes circuit-flow {
            to { background-position: 68px 58px, -68px -58px; }
        }

        @keyframes arrive {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 760px) {
            body { padding: 24px 16px; }

            .login-shell {
                max-width: 520px;
                min-height: auto;
                grid-template-columns: 1fr;
            }

            .login-panel {
                min-height: 500px;
                padding: 27px 30px 34px;
            }

            .image-panel {
                min-height: 300px;
            }

            .wallet-art {
                max-height: 360px;
            }

            .topbar {
                justify-content: center;
                gap: clamp(16px, 6vw, 28px);
            }

            .art-panel {
                min-height: 330px;
                clip-path: none;
            }

            .wallet-core {
                width: 112px;
                height: 112px;
                font-size: 40px;
            }

            .platform {
                bottom: 15%;
                left: 12%;
                width: 150px;
                height: 72px;
            }

            .orb-cloud { top: 12%; left: 35%; transform: scale(.8) rotate(-12deg); }
            .orb-camera { top: 22%; right: 7%; transform: scale(.8) rotate(-8deg); }
            .orb-phone { right: 11%; bottom: 14%; transform: scale(.8) rotate(8deg); }
        }

        @media (max-width: 380px) {
            .login-panel { padding-right: 22px; padding-left: 22px; }
            .topbar { gap: 14px; }
            .topbar a { font-size: 11px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
    <main class="login-shell container-fluid p-0">
        <section class="login-panel" aria-labelledby="page-title">
            

            <div class="form-wrap">
                <h1 class="wallet-title" id="page-title">Smart Wallet</h1>
                <div class="form-view" id="login-view">
                    <h1 class="welcome">Welcome back to your wallet.</h1>

                    <form class="login-form" id="login-form" action="#" method="get" autocomplete="off">
                        <input class="form-control tw-w-full" type="text" name="account" placeholder=" Enter your Username" aria-label="Username" autocomplete="off" required>
                        <input class="form-control tw-w-full" type="password" name="password" placeholder="Enter your password" aria-label="Password" autocomplete="off" required>
                        <button class="submit-button btn btn-primary tw-font-semibold" type="submit">Login</button>
                    </form>

                    <div class="account-links">
                        <a class="forgot-link" href="#forgot-password">Forgot password?</a>
                        <a class="forgot-link" id="show-register" href="#register" aria-controls="register-view" aria-expanded="false">Register</a>
                    </div>
                </div>

                <div class="form-view" id="register-view" aria-labelledby="register-title" hidden>
                    <h2 class="welcome" id="register-title">Create your account</h2>
                    <form class="login-form" id="register-form" action="#" method="post" autocomplete="off">
                        <input class="form-control tw-w-full" type="text" name="username" placeholder="Choose a username" aria-label="Username" autocomplete="off" required>
                        <input class="form-control tw-w-full" type="email" name="email" placeholder="Email address" aria-label="Email address" autocomplete="email" required>
                        <input class="form-control tw-w-full" type="password" name="password" placeholder="Create a password" aria-label="Password" autocomplete="new-password" minlength="8" required>
                        <button class="submit-button btn btn-primary tw-font-semibold" type="submit">Create account</button>
                    </form>
                    <div class="account-links">
                        <a class="forgot-link" id="show-login" href="#login" aria-controls="login-view" aria-expanded="false">Back to login</a>
                    </div>
                </div>
            </div>
        </section>
        <section class="image-panel" aria-label="Smart Wallet illustration">
            <img class="wallet-art" src="https://img.freepik.com/premium-vector/family-benefit-flat-style-illustration-design_538610-525.jpg" alt="Family benefits illustration">
        </section>
    </main>
</body>

<script src="./script.js"></script>
</html>
