<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#e3f5e8">
    <meta name="theme-color" content="#f3effb">
    <title>Smart Wallet | Overview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>
        tailwind = { config: { prefix: "tw-", corePlugins: { preflight: false } } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --page: #e5f3ea;
            --page: #f2eef9;
            --surface: #fff;
            --ink: #241d33;
            --muted: #766e84;
            --violet: #7044c5;
            --violet-dark: #4c288f;
            --line: #e8e1f1;
            --coral: #02690f;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 28px 20px;
            background: var(--page);
            color: var(--ink);
            font-family: "Manrope", "Trebuchet MS", sans-serif;
        }

        .dashboard {
            width: min(1060px, 100%);
            width: min(1160px, 100%);
            min-height: calc(100vh - 56px);
            margin: 0 auto;
            padding: 36px clamp(22px, 5vw, 70px) 48px;
            background: var(--surface);
            box-shadow: 0 24px 70px rgb(52 35 82 / 9%);
            animation: dashboard-enter 520ms ease-out both;
        }

        .dashboard-header {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: center;
            gap: 8px 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--line);
        }

        .brand {
            margin: 0;
            font-size: clamp(30px, 4vw, 40px);
            font-weight: 800;
            line-height: 1.15;
        }

        .brand span:first-child { color: var(--violet); }
        .brand span:last-child { color: #b030fa; }

        .dashboard-subtitle {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin: 0;
            padding: 6px 10px;
            background: #e0f6e3;
            color: #102c9c;
            font-size: 18px;
            font-weight: 700;
            line-height: 1.3;
            overflow-wrap: anywhere;
        }

        .logout-button {
            min-height: 38px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 16px;
            border-radius: 4px;
            background: #dc3545;
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            transition: background 160ms ease, transform 160ms ease;
        }

        .logout-button:hover,
        .logout-button:focus-visible {
            background: #bb2d3b;
            color: #fff;
            transform: translateY(-1px);
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
            width: 100%;
            margin: 24px 0 32px;
        }

        .summary-card {
            min-height: 132px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 18px 22px;
            border: 1px solid var(--line);
            border-top: 3px solid var(--violet);
            border-radius: 5px;
            background: #fcfbfe;
        }

        .summary-card h2 {
            margin: 0;
            color: var(--muted);
            font-size: 14px;
            font-weight: 700;
        }

        .summary-value {
            margin: 12px 0 0;
            color: var(--violet-dark);
            font-size: 27px;
            font-weight: 700;
            text-align: left;
            font-variant-numeric: tabular-nums;
        }

        .expense-card { border-top-color: var(--coral); }
        .expense-card h2,
        .expense-card .summary-value { color: #168653; }

        .forms-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .entry-form {
            padding: 22px;
            border: 1px solid var(--line);
            border-radius: 5px;
            background: #fff;
        }

        .entry-form h2 {
            margin: 0 0 13px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--line);
            color: var(--violet-dark);
            font-size: 18px;
            font-weight: 700;
        }

        .entry-fields {
            display: grid;
            gap: 12px;
        }

        .entry-fields input {
            min-height: 44px;
            border-color: #e4deec;
            border-radius: 4px;
            background: #fdfcff;
            font-size: 14px;
        }

        .entry-fields input:focus {
            border-color: #a98be1;
            box-shadow: 0 0 0 3px rgb(112 68 197 / 12%);
        }

        .entry-button {
            min-height: 44px;
            margin-top: 5px;
            border: 0;
            border-radius: 4px;
            color: #fff;
            font-weight: 700;
            transition: filter 160ms ease, transform 160ms ease, box-shadow 160ms ease;
        }

        .entry-button:hover { filter: brightness(.96); transform: translateY(-1px); box-shadow: 0 5px 12px rgb(56 37 88 / 12%); }
        .income-button { background: var(--violet); }
        .expense-button { background: #168653; color: #fff; }

        .dashboard-actions {
            display: flex;
            justify-content: flex-end;
            margin: 16px 0 0;
        }

        .clear-button {
            min-height: 38px;
            padding: 0 16px;
            border: 1px solid #ead4cc;
            border-radius: 4px;
            background:  #168653;;
            color: #fdfffd;
            font-size: 13px;
            font-weight: 700;
        }

        .clear-button:hover { background: #fbe9e2; }

        .details-section { margin-top: 48px; }

        .details-title {
            margin: 0 0 18px;
            padding-bottom: 13px;
            border-bottom: 1px solid var(--line);
            color: var(--ink);
            font-size: 22px;
            font-weight: 700;
        }

        .ledger-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .ledger-title {
            margin: 0 0 8px;
            color: var(--violet);
            font-size: 16px;
            font-weight: 700;
        }

        .ledger-grid > section:nth-child(2) .ledger-title { color:  #168653; }

        .table-wrap { overflow-x: auto; }

        .ledger-table {
            width: 100%;
            min-width: 430px;
            margin: 0;
            border-collapse: collapse;
            background: #fff;
            font-size: 12px;
        }

        .ledger-table th,
        .ledger-table td {
            padding: 11px 9px;
            border: 0;
            border-bottom: 1px solid #eeeaf2;
            text-align: left;
            vertical-align: middle;
        }

        .ledger-table th {
            border-bottom: 2px solid #d5c6eb;
            background: #f5f1fb;
            color: #43365b;
            font-weight: 700;
            white-space: nowrap;
        }

        .ledger-table td { overflow-wrap: anywhere; }
        .ledger-table td { overflow-wrap: anywhere; }
        .empty-row td { padding: 18px 10px; color: var(--muted); text-align: center; }

        @keyframes dashboard-enter {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 760px) {
            body { padding: 0; }
            .dashboard { min-height: 100vh; padding: 28px 20px 36px; }
            .summary-grid { gap: 12px; }
            .summary-card { min-height: 112px; padding: 15px; }
            .summary-card h2 { font-size: 13px; }
            .summary-value { font-size: 23px; }
            .entry-form { padding: 18px; }
            .forms-grid { gap: 14px; }
            .details-section { margin-top: 40px; }
            .ledger-grid { grid-template-columns: 1fr; gap: 22px; }
        }

        @media (max-width: 520px) {
            body { padding: 0; }
            .dashboard { padding: 24px 16px 32px; }
            .dashboard-header { gap: 8px 12px; }
            .summary-grid { grid-template-columns: 1fr 1fr; gap: 10px; margin: 20px 0 22px; }
            .summary-card { min-height: 104px; padding: 13px; }
            .summary-card h2 { font-size: 12px; }
            .summary-value { font-size: 20px; }
            .forms-grid { grid-template-columns: 1fr; gap: 12px; }
            .entry-form { padding: 18px; }
            .details-section { margin-top: 34px; }
            .details-title { font-size: 20px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
        }
    </style>
</head>
<body>
    <main class="dashboard">
        <header class="dashboard-header">
            <p class="dashboard-subtitle" id="welcome-user"></p>
            <h1 class="brand"><span>Smart</span> <span>Wallet</span></h1>
            <a class="logout-button" href="./index.html">Logout</a>
        </header>

        <section class="summary-grid" aria-label="Wallet summary" aria-live="polite">
            <article class="summary-card balance-card">
                <h2>Total Balance</h2>
                <p class="summary-value" id="total-balance">Rs 0/-</p>
            </article>
            <article class="summary-card expense-card">
                <h2>Total Expense</h2>
                <p class="summary-value" id="total-expense">Rs 0/-</p>
            </article>
        </section>

        <section class="forms-grid" aria-label="Add wallet transaction">
            <form class="entry-form" id="income-form">
                <h2>Add Income</h2>
                <div class="entry-fields">
                    <label class="visually-hidden" for="income-type">Income type</label>
                    <input class="form-control" id="income-type" name="description" type="text" placeholder="Enter Income Type" required maxlength="60">
                    <label class="visually-hidden" for="income-amount">Income amount in rupees</label>
                    <input class="form-control" id="income-amount" name="amount" type="number" placeholder="Enter Amount" min="0.01" step="0.01" required>
                    <button class="entry-button income-button tw-font-semibold" type="submit">Add Income</button>
                </div>
            </form>

            <form class="entry-form" id="expense-form">
                <h2>Add Expense</h2>
                <div class="entry-fields">
                    <label class="visually-hidden" for="expense-type">Expense type</label>
                    <input class="form-control" id="expense-type" name="description" type="text" placeholder="Enter Expense Type" required maxlength="60">
                    <label class="visually-hidden" for="expense-amount">Expense amount in rupees</label>
                    <input class="form-control" id="expense-amount" name="amount" type="number" placeholder="Enter Amount" min="0.01" step="0.01" required>
                    <button class="entry-button expense-button tw-font-semibold" type="submit">Add Expense</button>
                </div>
            </form>
        </section>

        <div class="dashboard-actions">
            <button class="clear-button" id="clear-all" type="button">Clear All</button>
        </div>

        <section class="details-section" aria-labelledby="details-title">
            <h2 class="details-title" id="details-title">Income and Expense Details</h2>
            <div class="ledger-grid">
                <section aria-labelledby="income-ledger-title">
                    <h3 class="ledger-title" id="income-ledger-title">Income</h3>
                    <div class="table-wrap">
                        <table class="ledger-table">
                            <thead><tr><th scope="col">Type</th><th scope="col">Amount</th><th scope="col">Balance</th><th scope="col">Date &amp; Time</th></tr></thead>
                            <tbody id="income-rows"><tr class="empty-row"><td colspan="4">No income entries yet.</td></tr></tbody>
                        </table>
                    </div>
                </section>
                <section aria-labelledby="expense-ledger-title">
                    <h3 class="ledger-title" id="expense-ledger-title">Expense</h3>
                    <div class="table-wrap">
                        <table class="ledger-table">
                            <thead><tr><th scope="col">Type</th><th scope="col">Amount</th><th scope="col">Balance</th><th scope="col">Date &amp; Time</th></tr></thead>
                            <tbody id="expense-rows"><tr class="empty-row"><td colspan="4">No expense entries yet.</td></tr></tbody>
                        </table>
                    </div>
                </section>
            </div>
        </section>
    </main>
    <script src="./home.js"></script>
</body>
</html>
